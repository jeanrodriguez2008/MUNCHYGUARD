<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MunchyGuard PT</title>

    <!-- CONFIGURACIÓN PWA CON CONTROL DE CACHÉ PARA ESCRITORIO -->
    <link rel="shortcut icon" href="{{ url_for('static', filename='logo2.png') }}?v=2" type="image/png">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='logo2.png') }}?v=2">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo2.png') }}?v=2">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}?v=2">
    <meta name="theme-color" content="#2563eb">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            position: relative;
            overflow: hidden;
        }
        .login-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 4px;
            background-color: #dc2626;
            border-radius: 2px;
        }
        .brand-logo {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 0.5rem auto;
        }
        .subtitle {
            color: #475569;
            font-size: 0.88rem;
            font-weight: 500;
            text-align: center;
            margin-bottom: 2rem;
            border-top: 2px solid #dc2626;
            padding-top: 0.8rem;
        }
        .btn-munchy {
            background-color: #1e3a8a;
            color: #ffffff;
            font-weight: 700;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            transition: background-color 0.2s;
        }
        .btn-munchy:hover {
            background-color: #172554;
            color: #ffffff;
        }
        .footer-credits {
            text-align: center;
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 1.8rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center">
        <!-- Logo Principal con autorrecuperación -->
        <img src="{{ url_for('static', filename='logo.png') }}?v=2" 
             onerror="this.onerror=null; this.src='{{ url_for('static', filename='logo2.png') }}?v=2';" 
             alt="Munchy Logo" 
             class="brand-logo">
        <div class="subtitle">Sistema Inteligente de Control de Inventario</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show small py-2" role="alert">
            {{ message }}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Nombre de Usuario</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-secondary"><i class="bi bi-person-fill"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required autofocus>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Contraseña de Acceso</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-secondary"><i class="bi bi-key-fill"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
            </div>
        </div>

        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-munchy">
                <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Sistema
            </button>
        </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top small">
        <a href="{{ url_for('registro') }}" class="text-decoration-none fw-bold text-primary">
            <i class="bi bi-person-plus-fill me-1"></i> Crear Cuenta
        </a>
        <a href="{{ url_for('recuperar_password') }}" class="text-decoration-none fw-bold text-danger">
            <i class="bi bi-shield-lock-fill me-1"></i> ¿Olvidó clave?
        </a>
    </div>

    <div class="footer-credits">
        Desarrollado por: <strong>Gerencia de Cadena de Suministro</strong>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- REGISTRO DEL SERVICE WORKER -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}?v=2")
                .then(reg => console.log('Service Worker registrado', reg))
                .catch(err => console.log('Error en Service Worker', err));
        });
    }
</script>
</body>
</html>
