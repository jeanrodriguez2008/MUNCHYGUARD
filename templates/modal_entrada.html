<!-- Librería Liviana para Escaneo QR mediante Cámara Nativa -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<!-- Modal Registro de Entrada Terminado (QR Activo) -->
<div class="modal fade" id="modalEntrada" tabindex="-1" aria-labelledby="modalEntradaLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="border-radius: 12px; overflow: hidden;">
            
            <div class="modal-header text-white px-4" style="background-color: #2563eb;">
                <h5 class="modal-title fw-bold" id="modalEntradaLabel" style="font-size: 1.1rem;">
                    <i class="bi bi-qr-code-scan"></i> Formulario de Ingreso de Producto Terminado (QR Activo)
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" onclick="detenerEscanerCamaraEntrada()"></button>
            </div>

            <form action="{{ url_for('registrar_entrada') }}" method="POST" autocomplete="off">
                <div class="modal-body p-4">
                    
                    <!-- LECTOR DE CÓDIGO QR / PISTOLA Y CÁMARA MÓVIL -->
                    <div class="p-3 border border-primary rounded bg-light mb-4" style="border-style: dashed !important;">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label small fw-bold text-primary mb-0"><i class="bi bi-camera-fill"></i> Escanear Código QR (Pistola / Lector / Cámara):</label>
                            <button type="button" class="btn btn-sm btn-primary fw-bold d-flex align-items-center gap-1" id="btn_toggle_cam_entrada" onclick="conmutarEscanerCamaraEntrada()">
                                <i class="bi bi-camera-fill"></i> Escanear Cámara
                            </button>
                        </div>
                        
                        <div id="cam_reader_entrada" class="mb-2 bg-dark rounded d-none" style="width: 100%; max-height: 280px; overflow: hidden;"></div>

                        <input type="text" id="qr_entrada_scanner" class="form-control form-control-lg bg-white" oninput="this.value = this.value.toUpperCase()" placeholder="Haga clic aquí antes de escanear el QR...">
                        <span class="text-muted d-block mt-1" style="font-size: 0.75rem;">Formato esperado: Código|Descripción|Lote|DD/MM/AAAA|Cantidad|NumRecibo|...</span>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-dark">Tipo de Entrada / Motivo:</label>
                            <select name="tipo_motivo" id="v10_motivo_entrada" class="form-select" onchange="evaluarCamposDinamicosEntrada()" required>
                                <option value="PRODUCCION">Producción Interna</option>
                                <option value="DEVOLUCION" selected>Devolución de Cliente</option>
                                <option value="TRASLADO">Traslado entre Almacenes</option>
                                <option value="AJUSTE">Ajuste de Inventario (+)</option>
                            </select>
                        </div>

                        <!-- SELECCIÓN MANUAL CON BÚSQUEDA ULTRARRÁPIDA EN MEMORIA -->
                        <div class="col-md-6" style="position: relative;">
                            <label class="form-label small fw-bold text-dark"><i class="bi bi-search"></i> Seleccionar Producto (Escribe Código o Nombre):</label>
                            <div class="input-group">
                                <input type="text" id="v10_busqueda_producto" class="form-control" placeholder="Ej: SKU o Nombre..." oninput="this.value = this.value.toUpperCase(); buscarProductosEntradaEnMemoria();" onfocus="this.select(); buscarProductosEntradaEnMemoria();" onclick="buscarProductosEntradaEnMemoria();">
                                <button class="btn btn-outline-secondary text-muted fw-bold" type="button" onclick="limpiarSeleccionProductoEntrada()" title="Limpiar y buscar otro SKU">
                                    <i class="bi bi-x-circle-fill text-danger"></i>
                                </button>
                            </div>
                            <input type="hidden" name="codigo_producto" id="codigo_producto_input" required>
                            <div id="v10_dropdown_productos" class="dropdown-menu position-absolute w-100 shadow" style="max-height: 200px; overflow-y: auto; z-index: 1060;"></div>
                        </div>

                        <!-- BANNER DE CONFIRMACIÓN VISUAL -->
                        <div class="col-12">
                            <div class="p-2 border rounded bg-light text-center fw-semibold text-secondary d-flex justify-content-center gap-3 align-items-center" style="font-size: 0.9rem;">
                                <span id="visual_sku">--</span>
                                <span class="text-muted">|</span>
                                <span id="visual_articulo">Ningún producto seleccionado</span>
                            </div>
                        </div>

                        <!-- CAUSA DE LA DEVOLUCIÓN -->
                        <div class="col-12" id="contenedor_motivo_devolucion">
                            <label class="form-label small fw-bold text-danger">Motivo Específico de la Devolución:</label>
                            <select name="detalle_devolucion" class="form-select border-danger">
                                <option value="">-- Seleccione Causa del Reingreso --</option>
                                <option value="Avería">Avería</option>
                                <option value="Vencido">Vencido</option>
                                <option value="Mal Despacho">Mal Despacho</option>
                                <option value="Rechazo por el Cliente">Rechazo por el Cliente</option>
                            </select>
                        </div>

                        <!-- ALMACÉN ORIGEN -->
                        <div class="col-md-6 d-none" id="contenedor_almacen_origen" style="position: relative;">
                            <label class="form-label small fw-bold text-dark">Almacén de Origen (Emisor):</label>
                            <input type="text" id="busqueda_entrada_origen" class="form-control" placeholder="Escriba código o nombre..." oninput="this.value = this.value.toUpperCase(); filtrarDropdownOrigenEntrada();" onfocus="this.select(); filtrarDropdownOrigenEntrada();">
                            <input type="hidden" name="almacen_origen" id="select_entrada_origen">
                            <div id="dropdown_entrada_origen" class="dropdown-menu position-absolute w-100 shadow" style="max-height: 200px; overflow-y: auto; z-index: 1060;">
                                {% for a in almacenes %}
                                <button type="button" class="dropdown-item small py-2 item-origen-entrada" onmousedown="seleccionarDatoCustom('select_entrada_origen', 'busqueda_entrada_origen', '{{ a.codigo }}', '{{ a.nombre }}', 'dropdown_entrada_origen'); validarAlmacenesDiferentesEntrada(); conmutarLoteTraslado();">
                                    <strong>{{ a.codigo }}</strong> - {{ a.nombre }}
                                </button>
                                {% endfor %}
                            </div>
                        </div>

                        <!-- ALMACÉN DESTINO -->
                        <div class="col-md-6" id="contenedor_almacen_destino" style="position: relative;">
                            <label class="form-label small fw-bold text-dark">Almacén Destino (Receptor):</label>
                            <input type="text" id="busqueda_entrada_destino" class="form-control" placeholder="Escriba código o nombre..." oninput="this.value = this.value.toUpperCase(); filtrarDropdownDestinoEntrada();" onfocus="this.select(); filtrarDropdownDestinoEntrada();">
                            <input type="hidden" name="almacen_destino" id="select_entrada_destino">
                            <div id="dropdown_entrada_destino" class="dropdown-menu position-absolute w-100 shadow" style="max-height: 200px; overflow-y: auto; z-index: 1060;">
                                {% for a in almacenes %}
                                <button type="button" class="dropdown-item small py-2 item-destino-entrada" onmousedown="seleccionarDatoCustom('select_entrada_destino', 'busqueda_entrada_destino', '{{ a.codigo }}', '{{ a.nombre }}', 'dropdown_entrada_destino'); validarAlmacenesDiferentesEntrada();">
                                    <strong>{{ a.codigo }}</strong> - {{ a.nombre }}
                                </button>
                                {% endfor %}
                            </div>
                        </div>

                        <!-- NÚMERO DE LOTE -->
                        <div class="col-md-6" id="contenedor_lote_entrada_global" style="position: relative;">
                            <label class="form-label small fw-bold text-dark">Número de Lote:</label>
                            <input type="text" name="numero_lote" id="input_lote_entrada" class="form-control" oninput="this.value = this.value.toUpperCase();" placeholder="LOTE" onfocus="abrirLotesDisponiblesTraslado()" required>
                            <div id="dropdown_lote_entrada_transferencia" class="dropdown-menu position-absolute w-100 shadow" style="max-height: 200px; overflow-y: auto; z-index: 1060;"></div>
                        </div>

                        <!-- FECHA DE VENCIMIENTO -->
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-dark">Fecha Vencimiento:</label>
                            <input type="date" name="fecha_vencimiento" id="input_venc_entrada" class="form-control" required>
                        </div>

                        <!-- CANTIDAD RECIBIDA -->
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-dark">Cantidad Recibida (Unidades):</label>
                            <div class="input-group">
                                <input type="number" name="cantidad" id="input_cant_entrada" class="form-control" placeholder="Ej: 500" min="1" required>
                                <span class="input-group-text bg-light font-monospace small" id="lbl_stock_max_transferencia" style="display: none;">Max: 0</span>
                            </div>
                        </div>

                        <!-- REFERENCIA DE GUÍA O DOCUMENTO -->
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-dark">Referencia Guía / Factura:</label>
                            <input type="text" name="referencia_documento" id="input_ref_entrada" class="form-control" oninput="this.value = this.value.toUpperCase()" placeholder="Ej: G-00215" required>
                        </div>

                    </div>
                </div>

                <div class="modal-footer bg-light p-3">
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2" style="background-color: #2563eb; border: none;">
                        Procesar Ingreso
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script>
// Carga del catálogo completo a la memoria JS (instantáneo)
const productosEntradaMemoria = [
    {% for p in productos %}
    { codigo: "{{ p.codigo }}", articulo: "{{ p.articulo | replace('\"', '') }}" },
    {% endfor %}
];

let html5QrCodeEntrada = null;

function buscarProductosEntradaEnMemoria() {
    const query = document.getElementById('v10_busqueda_producto').value.trim().toLowerCase();
    const dropdown = document.getElementById('v10_dropdown_productos');
    dropdown.innerHTML = '';

    // Filtra por coincidencia o toma los primeros 20 si está vacío
    const filtrados = query 
        ? productosEntradaMemoria.filter(p => p.codigo.toLowerCase().includes(query) || p.articulo.toLowerCase().includes(query)).slice(0, 20)
        : productosEntradaMemoria.slice(0, 20);

    if (filtrados.length === 0) {
        dropdown.innerHTML = '<div class="dropdown-item small text-muted text-center py-2">Sin coincidencias</div>';
    } else {
        filtrados.forEach(p => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'dropdown-item small py-2';
            btn.innerHTML = `<strong>${p.codigo}</strong> - ${p.articulo}`;
            btn.onmousedown = function() {
                seleccionarDatoCustom('codigo_producto_input', 'v10_busqueda_producto', p.codigo, `${p.codigo} - ${p.articulo}`, 'v10_dropdown_productos', 'visual_sku', 'visual_articulo', p.codigo, p.articulo);
                conmutarLoteTraslado();
            };
            dropdown.appendChild(btn);
        });
    }
    dropdown.classList.add('show');
}

function filtrarDropdownOrigenEntrada() {
    const query = document.getElementById('busqueda_entrada_origen').value.trim().toLowerCase();
    const dropdown = document.getElementById('dropdown_entrada_origen');
    const items = dropdown.getElementsByClassName('dropdown-item');
    let count = 0;
    for (let item of items) {
        const text = item.innerText.toLowerCase();
        if (!query || text.includes(query)) {
            item.style.display = count < 20 ? 'block' : 'none';
            count++;
        } else {
            item.style.display = 'none';
        }
    }
    dropdown.classList.toggle('show', count > 0);
}

function filtrarDropdownDestinoEntrada() {
    const query = document.getElementById('busqueda_entrada_destino').value.trim().toLowerCase();
    const dropdown = document.getElementById('dropdown_entrada_destino');
    const items = dropdown.getElementsByClassName('dropdown-item');
    let count = 0;
    for (let item of items) {
        const text = item.innerText.toLowerCase();
        if (!query || text.includes(query)) {
            item.style.display = count < 20 ? 'block' : 'none';
            count++;
        } else {
            item.style.display = 'none';
        }
    }
    dropdown.classList.toggle('show', count > 0);
}

function limpiarSeleccionProductoEntrada() {
    document.getElementById('codigo_producto_input').value = '';
    const inputBusqueda = document.getElementById('v10_busqueda_producto');
    inputBusqueda.value = '';
    document.getElementById('visual_sku').innerText = '--';
    document.getElementById('visual_articulo').innerText = 'Ningún producto seleccionado';
    buscarProductosEntradaEnMemoria();
    inputBusqueda.focus();
}

function seleccionarDatoCustom(hiddenId, inputId, codigo, textoVisible, dropdownId, labelSkuId=null, labelArtId=null, valSku='', valArt='') {
    document.getElementById(hiddenId).value = codigo;
    document.getElementById(inputId).value = textoVisible;
    document.getElementById(dropdownId).classList.remove('show');
    
    if (labelSkuId && labelArtId) {
        document.getElementById(labelSkuId).innerText = valSku;
        document.getElementById(labelArtId).innerText = valArt;
    }
}

function conmutarEscanerCamaraEntrada() {
    const readerDiv = document.getElementById('cam_reader_entrada');
    const btnCam = document.getElementById('btn_toggle_cam_entrada');

    if (readerDiv.classList.contains('d-none')) {
        readerDiv.classList.remove('d-none');
        btnCam.innerHTML = '<i class="bi bi-camera-video-off-fill"></i> Cerrar Cámara';
        btnCam.classList.remove('btn-primary');
        btnCam.classList.add('btn-secondary');

        html5QrCodeEntrada = new Html5Qrcode("cam_reader_entrada");
        html5QrCodeEntrada.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 220, height: 220 } },
            (qrCodeMessage) => {
                procesarCadenaQREntrada(qrCodeMessage);
                detenerEscanerCamaraEntrada();
            },
            (errorMessage) => { }
        ).catch(err => {
            alert("⚠️ No se pudo acceder a la cámara del dispositivo.");
            detenerEscanerCamaraEntrada();
        });
    } else {
        detenerEscanerCamaraEntrada();
    }
}

function detenerEscanerCamaraEntrada() {
    const readerDiv = document.getElementById('cam_reader_entrada');
    const btnCam = document.getElementById('btn_toggle_cam_entrada');

    if (html5QrCodeEntrada) {
        html5QrCodeEntrada.stop().then(() => {
            html5QrCodeEntrada.clear();
            html5QrCodeEntrada = null;
        }).catch(() => {});
    }
    if (readerDiv) readerDiv.classList.add('d-none');
    if (btnCam) {
        btnCam.innerHTML = '<i class="bi bi-camera-fill"></i> Escanear Cámara';
        btnCam.classList.remove('btn-secondary');
        btnCam.classList.add('btn-primary');
    }
}

/* ========================================================
   PARSER DE QR ACTUALIZADO (PROCESA LOS CAMPOS DEL QR EXTENDIDO)
   FORMATO: Codigo|Articulo|Lote|FechaVenc|Cantidad|NumRecibo|...
   ======================================================== */
// Reemplazar la función procesarCadenaQREntrada en modal_entrada.html con esta versión tolerante:
function procesarCadenaQREntrada(rawData) {
    if (!rawData) return;
    const partes = rawData.trim().split('|');

    // Estructura desde MunchyProdQR: Código | Descripción | Lote | Vencimiento | Cantidad | [Opcional: NumRecibo]
    if (partes.length >= 4) {
        const sku_qr     = partes[0] ? partes[0].trim() : '';
        const desc_qr    = partes[1] ? partes[1].trim() : '';
        const lote_qr    = partes[2] ? partes[2].trim() : '';
        const venc_qr    = partes[3] ? partes[3].trim() : '';
        const cant_qr    = partes[4] ? partes[4].trim() : '';
        const recibo_qr  = partes[5] ? partes[5].trim() : '';

        // 1. Asignación Automática de Reglas por Defecto para Producción Interna
        const selectMotivo = document.getElementById('v10_motivo_entrada');
        if (selectMotivo) {
            selectMotivo.value = 'PRODUCCION';
            evaluarCamposDinamicosEntrada(); // Muestra Origen y Destino en la interfaz
        }

        // 2. Asignación Automática de Gal-Morita (Origen) y Gal-MORII (Destino)
        seleccionarDatoCustom('select_entrada_origen', 'busqueda_entrada_origen', 'Gal-Morita', 'Gal-Morita', 'dropdown_entrada_origen');
        seleccionarDatoCustom('select_entrada_destino', 'busqueda_entrada_destino', 'Gal-MORII', 'Gal-MORII', 'dropdown_entrada_destino');

        // 3. Asignación de SKU y Banner Visual
        document.getElementById('codigo_producto_input').value = sku_qr;
        document.getElementById('v10_busqueda_producto').value = `${sku_qr} - ${desc_qr}`;
        document.getElementById('visual_sku').innerText = sku_qr;
        document.getElementById('visual_articulo').innerText = desc_qr;

        // 4. Asignación de Lote
        document.getElementById('input_lote_entrada').value = lote_qr.toUpperCase();

        // 5. Formateo de Fecha de Vencimiento (DD/MM/AAAA -> YYYY-MM-DD)
        if (venc_qr) {
            if (venc_qr.includes('/')) {
                const sub = venc_qr.split('/');
                if (sub.length === 3) {
                    const dia = sub[0].padStart(2, '0');
                    const mes = sub[1].padStart(2, '0');
                    const anio = sub[2].length === 2 ? '20' + sub[2] : sub[2];
                    document.getElementById('input_venc_entrada').value = `${anio}-${mes}-${dia}`;
                }
            } else {
                document.getElementById('input_venc_entrada').value = venc_qr;
            }
        }

        // 6. Cantidad Recibida
        if (cant_qr) document.getElementById('input_cant_entrada').value = cant_qr;

        // 7. VALIDACIÓN PREVENTIVA DEL DOCUMENTO: Asigna el número de recibo exacto
        if (recibo_qr) {
            document.getElementById('input_ref_entrada').value = recibo_qr.toUpperCase();
        } else {
            // Si el QR no trae recibo explícito, genera el número de recibo basado en el lote
            document.getElementById('input_ref_entrada').value = `REC-${lote_qr.toUpperCase()}`;
        }

        document.getElementById('input_cant_entrada').focus();
    } else {
        alert("⚠️ El código QR de MunchyProdQR no cumple con el formato esperado (Código|Descripción|Lote|Vencimiento)");
    }
}

function evaluarCamposDinamicosEntrada() {
    const motivo = document.getElementById('v10_motivo_entrada').value;
    const contenedorOrigen = document.getElementById('contenedor_almacen_origen');
    const contenedorDestino = document.getElementById('contenedor_almacen_destino');
    const inputOrigen = document.getElementById('busqueda_entrada_origen');
    const inputDestino = document.getElementById('busqueda_entrada_destino');

    if (motivo === 'DEVOLUCION') {
        document.getElementById('contenedor_motivo_devolucion').classList.remove('d-none');
        contenedorOrigen.classList.add('d-none');
        contenedorDestino.className = "col-md-6";
        if(inputOrigen) inputOrigen.required = false;
        if(inputDestino) inputDestino.required = true;
    } 
    else if (motivo === 'TRASLADO' || motivo === 'PRODUCCION') {
        document.getElementById('contenedor_motivo_devolucion').classList.add('d-none');
        contenedorOrigen.classList.remove('d-none');
        contenedorOrigen.className = "col-md-6";
        contenedorDestino.className = "col-md-6";
        if(inputOrigen) inputOrigen.required = true;
        if(inputDestino) inputDestino.required = true;
    } 
    else {
        document.getElementById('contenedor_motivo_devolucion').classList.add('d-none');
        contenedorOrigen.classList.add('d-none');
        contenedorDestino.className = "col-12";
        if(inputOrigen) inputOrigen.required = false;
        if(inputDestino) inputDestino.required = true;
    }
    validarAlmacenesDiferentesEntrada();
    conmutarLoteTraslado();
}

function validarAlmacenesDiferentesEntrada() {
    const motivo = document.getElementById('v10_motivo_entrada').value;
    if (motivo === 'TRASLADO' || motivo === 'PRODUCCION') {
        const origen = document.getElementById('select_entrada_origen').value;
        const destino = document.getElementById('select_entrada_destino').value;

        if (origen && destino && origen === destino) {
            alert("⚠️ Operación Inválida: El Almacén de Origen y el Almacén Destino no pueden ser iguales.");
            document.getElementById('select_entrada_destino').value = "";
            document.getElementById('busqueda_entrada_destino').value = "";
        }
    }
}

function conmutarLoteTraslado() {
    const motivo = document.getElementById('v10_motivo_entrada').value;
    const lblStock = document.getElementById('lbl_stock_max_transferencia');
    const inputCant = document.getElementById('input_cant_entrada');
    
    if (motivo !== 'TRASLADO' && motivo !== 'PRODUCCION') {
        lblStock.style.display = 'none';
        inputCant.removeAttribute('max');
        document.getElementById('dropdown_lote_entrada_transferencia').classList.remove('show');
    }
}

function abrirLotesDisponiblesTraslado() {
    const motivo = document.getElementById('v10_motivo_entrada').value;
    if (motivo !== 'TRASLADO' && motivo !== 'PRODUCCION') return;

    const producto = document.getElementById('codigo_producto_input').value;
    const almacenOrigen = document.getElementById('select_entrada_origen').value;
    const menuLote = document.getElementById('dropdown_lote_entrada_transferencia');

    if (!producto || !almacenOrigen) {
        menuLote.innerHTML = '<div class="dropdown-item small text-muted text-center">⚠️ Seleccione Producto y Almacén Origen primero.</div>';
        menuLote.classList.add('show');
        return;
    }

    menuLote.innerHTML = '<div class="dropdown-item small text-muted text-center"><span class="spinner-border spinner-border-sm me-1"></span>Buscando lotes activos...</div>';
    menuLote.classList.add('show');

    fetch(`/api/lotes_disponibles?producto=${producto}&almacen=${almacenOrigen}`)
        .then(res => res.json())
        .then(data => {
            menuLote.innerHTML = '';
            if (data.length === 0) {
                menuLote.innerHTML = '<div class="dropdown-item small text-danger text-center">❌ Sin inventario físico en este CEDIS.</div>';
                return;
            }

            data.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'dropdown-item small py-2';
                btn.innerHTML = `Lote: <strong>${item.lote}</strong> — Disp: <span class="text-success fw-bold">${item.cantidad} unds</span> <small class="text-muted">(Venc: ${item.vencimiento})</small>`;
                btn.onmousedown = function() {
                    document.getElementById('input_lote_entrada').value = item.lote;
                    menuLote.classList.remove('show');
                    
                    const lblStock = document.getElementById('lbl_stock_max_transferencia');
                    lblStock.innerText = "Max: " + item.cantidad;
                    lblStock.style.display = 'inline-block';
                    
                    document.getElementById('input_cant_entrada').max = item.cantidad;
                    
                    const subpartes = item.vencimiento.split('/');
                    if (subpartes.length === 3) {
                        document.getElementById('input_venc_entrada').value = `${subpartes[2]}-${subpartes[1]}-${subpartes[0]}`;
                    }
                };
                menuLote.appendChild(btn);
            });
        })
        .catch(() => {
            menuLote.innerHTML = '<div class="dropdown-item small text-danger text-center">❌ Error de comunicación con la API.</div>';
        });
}

document.getElementById('qr_entrada_scanner').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        procesarCadenaQREntrada(this.value);
        this.value = '';
    }
});

document.addEventListener("DOMContentLoaded", function() {
    evaluarCamposDinamicosEntrada();
    
    document.addEventListener('click', function(e) {
        const selectors = [
            { input: 'v10_busqueda_producto', menu: 'v10_dropdown_productos' },
            { input: 'busqueda_entrada_origen', menu: 'dropdown_entrada_origen' },
            { input: 'busqueda_entrada_destino', menu: 'dropdown_entrada_destino' },
            { input: 'input_lote_entrada', menu: 'dropdown_lote_entrada_transferencia' }
        ];
        selectors.forEach(s => {
            const inp = document.getElementById(s.input);
            const menu = document.getElementById(s.menu);
            if (inp && menu && e.target !== inp && !menu.contains(e.target)) {
                menu.classList.remove('show');
            }
        });
    });
});

const modalEntradaElem = document.getElementById('modalEntrada');
if (modalEntradaElem) {
    modalEntradaElem.addEventListener('hidden.bs.modal', function () {
        detenerEscanerCamaraEntrada();
    });
}
